<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGI SLATE · Voice Math with Math.js</title>
  <!-- Tailwind, Fonts, Icons -->
  <script src="https://cdn.tailwindcss.com/3.4.17">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&amp;family=Orbitron:wght@400;700;900&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js">
  </script>
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.min.js">
  </script>
  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>
  <!-- Math.js for robust math evaluation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js">
  </script>
  <style>
        :root {
            --cyan: #00f5ff;
            --purple: #a855f7;
            --pink: #ec4899;
            --blue: #3b82f6;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Raleway', sans-serif; margin: 0; overflow: hidden; background: #0a0a1a; color: #e0e0ff; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 15, 40, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(0, 245, 255, 0.15); border-radius: 16px; }
        .glass-strong { background: rgba(20, 20, 50, 0.8); backdrop-filter: blur(30px); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 16px; }
        .neon-border { box-shadow: 0 0 10px rgba(0, 245, 255, 0.3), inset 0 0 10px rgba(0, 245, 255, 0.05); }
        .neon-text { text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan); }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s, transform 0.8s; }
        .screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse-dot 2s infinite; }
        .status-dot.green { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.yellow { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .status-dot.red { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes glow-pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
        .btn-cyber { transition: all 0.2s; cursor: pointer; user-select: none; }
        .btn-cyber:hover { transform: scale(1.05); filter: brightness(1.2); }
        .btn-cyber:active { transform: scale(0.95); }
        #drawing-canvas { cursor: crosshair; }
        .control-btn { width: 100%; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid rgba(0,245,255,0.1); background: rgba(15,15,40,0.5); color: #c0c0ff; }
        .control-btn:hover { background: rgba(0,245,255,0.1); border-color: rgba(0,245,255,0.3); }
        .control-btn.active { background: rgba(0,245,255,0.15); border-color: var(--cyan); color: var(--cyan); }
        .splash-logo { font-size: 3rem; animation: glow-pulse 2s infinite; }
        .progress-bar { height: 4px; background: rgba(0,245,255,0.2); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); transition: width 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,245,255,0.3); border-radius: 3px; }
        #qr-reader video { object-fit: cover !important; border-radius: 8px; }
        #qr-reader { border: none !important; }
        #math-result {
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            border-left: 3px solid var(--cyan);
            padding: 10px 16px;
            border-radius: 12px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(0,245,255,0.2);
        }
        .faculty-badge {
            background: rgba(0,245,255,0.08);
            border: 1px solid rgba(0,245,255,0.2);
            border-radius: 40px;
            padding: 6px 16px 6px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #a0f0ff;
        }
  </style>
 </head>
 <body>
  <canvas id="particles-canvas"></canvas>

  <!-- Splash Screen -->
  <div id="splash-screen" class="screen">
   <div class="text-center">
    <div class="splash-logo font-orbitron font-bold neon-text">DIGI SLATE</div>
    <p class="mt-4 text-cyan-300 opacity-70">Initializing Neural Interface...</p>
    <div class="progress-bar w-64 mx-auto mt-8">
     <div id="splash-progress" class="progress-fill" style="width:0%"></div>
    </div>
   </div>
  </div>

  <!-- Login Screen (QR only) -->
  <div id="login-screen" class="screen hidden">
   <div class="glass-strong neon-border p-6 sm:p-8 w-full max-w-md mx-4">
    <h2 class="font-orbitron text-xl text-center neon-text mb-4">🔐 FACULTY ACCESS</h2>
    <p class="text-xs text-cyan-300/70 text-center mb-6">Scan your official Faculty QR badge to enter</p>
    <div id="qr-login-container" class="space-y-4 text-center">
     <div id="qr-reader" class="w-full bg-black/40 rounded-xl overflow-hidden border border-cyan-500/30 p-2 min-h-[220px] flex items-center justify-center"></div>
     <p id="qr-status" class="text-xs text-gray-400 italic">Initializing camera scanner...</p>
     <button onclick="simulateQRLogin()" class="mt-2 text-[11px] text-purple-400 hover:text-purple-300 underline-offset-2 underline">🔑 Demo: Simulate QR (faculty@demo.com)</button>
    </div>
   </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="screen hidden" style="flex-direction:column; align-items:stretch;">
   <header class="glass px-4 py-2 mx-2 mt-2 flex items-center justify-between gap-4 relative z-10" style="border-radius:12px;">
    <div class="flex items-center gap-3">
     <h1 class="font-orbitron font-bold text-lg neon-text">DIGI SLATE</h1>
     <span class="text-[10px] text-purple-300 opacity-70">AI Gesture Smart board</span>
    </div>
    <div class="flex items-center gap-4 text-[11px]">
     <span class="faculty-badge"><i data-lucide="badge-check" style="width:14px;height:14px;color:#00f5ff;"></i><span id="faculty-email-display">faculty@domain.com</span></span>
     <span class="flex items-center gap-1"><span id="cam-dot" class="status-dot yellow"></span><span id="cam-status">Loading</span></span>
     <span class="flex items-center gap-1"><span id="hand-dot" class="status-dot red"></span><span id="hand-status">No Hand</span></span>
     <span class="flex items-center gap-1"><span id="draw-dot" class="status-dot green"></span><span id="draw-status">Ready</span></span>
     <span class="text-cyan-400">FPS: <span id="fps-display">0</span></span>
     <span class="text-purple-300">Gesture: <span id="gesture-display">None</span></span>
     <button onclick="logoutFaculty()" class="text-red-400 hover:text-red-300 ml-2 px-2 py-1 rounded border border-red-500/30 hover:bg-red-500/20 text-[10px] transition">Logout</button>
    </div>
   </header>

   <div class="flex flex-1 gap-2 p-2 overflow-hidden" style="min-height:0;">
    <div class="flex-1 relative glass neon-border overflow-hidden" style="min-width:0;">
     <video id="camera-video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover opacity-30" style="transform:scaleX(-1);"></video>
     <canvas id="hand-canvas" class="absolute inset-0 w-full h-full"></canvas>
     <canvas id="drawing-canvas" class="absolute inset-0 w-full h-full"></canvas>
     <div id="math-result" class="absolute bottom-4 left-4 glass px-4 py-2 text-cyan-300 font-mono text-sm hidden"></div>
     <div id="shape-result" class="absolute top-4 left-4 glass px-3 py-1 text-purple-300 text-xs hidden"></div>
    </div>

    <aside class="w-56 flex flex-col gap-2 overflow-y-auto pr-1" style="min-height:0;">
     <div class="glass-strong p-3 space-y-2">
      <h3 class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold mb-2">Tools</h3>
      <button id="btn-gesture" class="control-btn active" onclick="toggleGesture()"><i data-lucide="hand" style="width:14px;height:14px;"></i>Air Gestures</button>
      <button id="btn-mouse" class="control-btn active" onclick="toggleMouse()"><i data-lucide="mouse-pointer" style="width:14px;height:14px;"></i>Mouse Draw</button>
      <button id="btn-voice" class="control-btn" onclick="toggleVoice()"><i data-lucide="mic" style="width:14px;height:14px;"></i>Voice Commands</button>
      <button id="btn-math" class="control-btn" onclick="toggleMath()"><i data-lucide="calculator" style="width:14px;height:14px;"></i>Math Solver</button>
      <button id="btn-shape" class="control-btn" onclick="toggleShape()"><i data-lucide="shapes" style="width:14px;height:14px;"></i>Shape Recognition</button>
     </div>
     <div class="glass-strong p-3 space-y-2">
      <h3 class="text-[10px] uppercase tracking-widest text-purple-400 font-bold mb-2">Brush</h3>
      <div class="flex items-center gap-2"><label class="text-[10px] text-gray-400 w-10">Size</label> <input id="brush-size" type="range" min="1" max="30" value="4" class="flex-1 accent-cyan-400" oninput="updateBrush()"></div>
      <div class="flex items-center gap-2"><label class="text-[10px] text-gray-400 w-10">Color</label> <input id="brush-color" type="color" value="#00f5ff" class="w-8 h-6 rounded border-0 cursor-pointer" oninput="updateBrush()"></div>
      <div class="flex items-center gap-2"><label class="text-[10px] text-gray-400 w-10">Glow</label> <input id="brush-glow" type="range" min="0" max="30" value="12" class="flex-1 accent-purple-400" oninput="updateBrush()"></div>
      <select id="brush-type" class="w-full text-xs rounded-lg px-2 py-1 bg-black/40 border border-purple-500/30 text-white" onchange="updateBrush()">
       <option value="glow">Glow Brush</option><option value="neon">Neon Brush</option><option value="pen">Pen</option><option value="marker">Marker</option><option value="eraser">Eraser</option>
      </select>
     </div>
     <div class="glass-strong p-3 space-y-2">
      <h3 class="text-[10px] uppercase tracking-widest text-pink-400 font-bold mb-2">Actions</h3>
      <div class="grid grid-cols-2 gap-1">
       <button class="control-btn justify-center" onclick="undo()"><i data-lucide="undo" style="width:12px;height:12px;"></i>Undo</button>
       <button class="control-btn justify-center" onclick="redo()"><i data-lucide="redo" style="width:12px;height:12px;"></i>Redo</button>
       <button class="control-btn justify-center" onclick="clearCanvas()"><i data-lucide="trash-2" style="width:12px;height:12px;"></i>Clear</button>
       <button class="control-btn justify-center" onclick="saveCanvas()"><i data-lucide="save" style="width:12px;height:12px;"></i>Save</button>
       <button class="control-btn justify-center col-span-2" onclick="exportCanvas()"><i data-lucide="download" style="width:12px;height:12px;"></i>Export PNG</button>
      </div>
     </div>
    </aside>
   </div>
  </div>

  <script>
    // ----------------------------------------------
    // 1. PARTICLES
    // ----------------------------------------------
    (function() {
        const pc = document.getElementById('particles-canvas');
        const pctx = pc.getContext('2d');
        let particles = [];

        function resizeParticles() { pc.width = window.innerWidth;
            pc.height = window.innerHeight; }
        resizeParticles();
        window.addEventListener('resize', resizeParticles);
        for (let i = 0; i < 60; i++) {
            particles.push({ x: Math.random() * pc.width, y: Math.random() * pc.height, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 2 + 0.5, color: ['#00f5ff', '#a855f7', '#ec4899', '#3b82f6'][Math.floor(Math.random() * 4)] });
        }

        function animParticles() {
            pctx.clearRect(0, 0, pc.width, pc.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = pc.width;
                if (p.x > pc.width) p.x = 0;
                if (p.y < 0) p.y = pc.height;
                if (p.y > pc.height) p.y = 0;
                pctx.beginPath();
                pctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                pctx.fillStyle = p.color;
                pctx.globalAlpha = 0.4;
                pctx.fill();
            });
            pctx.globalAlpha = 1;
            requestAnimationFrame(animParticles);
        }
        animParticles();
    })();

    // ----------------------------------------------
    // 2. SPLASH -> LOGIN
    // ----------------------------------------------
    let splashProgress = 0;
    const splashInterval = setInterval(() => {
        splashProgress += Math.random() * 15 + 5;
        if (splashProgress >= 100) splashProgress = 100;
        document.getElementById('splash-progress').style.width = splashProgress + '%';
        if (splashProgress >= 100) {
            clearInterval(splashInterval);
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            startQRScanner();
        }
    }, 200);

    // ----------------------------------------------
    // 3. QR SCANNER (standalone)
    // ----------------------------------------------
    let html5QrcodeScanner = null;
    let loggedIn = false;
    let facultyEmail = 'faculty@demo.com';

    function startQRScanner() {
        const qrStatus = document.getElementById('qr-status');
        qrStatus.textContent = "Requesting camera access...";
        if (!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
        }
        html5QrcodeScanner.start({ facingMode: "user" }, { fps: 10, qrbox: { width: 200, height: 200 } },
            (decodedText) => {
                qrStatus.textContent = "✅ QR Verified! Logging in...";
                const parts = decodedText.split(':');
                let email = parts[0].trim();
                if (email.includes('@')) {
                    facultyEmail = email;
                    loginSuccess();
                } else {
                    qrStatus.textContent = "Invalid QR: missing faculty email";
                }
            },
            (errorMessage) => {
                qrStatus.textContent = "📷 Scanning... align QR code";
            }
        ).catch(err => {
            qrStatus.textContent = "⚠️ Camera unavailable. Use demo button.";
        });
    }

    function stopQRScanner() {
        if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
            html5QrcodeScanner.stop().catch(err => console.error(err));
        }
    }

    window.simulateQRLogin = function() {
        facultyEmail = 'faculty@demo.com';
        loginSuccess();
    };

    function loginSuccess() {
        if (loggedIn) return;
        loggedIn = true;
        stopQRScanner();
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('faculty-email-display').textContent = facultyEmail;
        resizeDrawingCanvas();
        initCamera();
        lucide.createIcons();
    }

    window.logoutFaculty = function() {
        loggedIn = false;
        location.reload();
    };

    // ----------------------------------------------
    // 4. DRAWING ENGINE
    // ----------------------------------------------
    const drawCanvas = document.getElementById('drawing-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    let brush = { size: 4, color: '#00f5ff', glow: 12, type: 'glow' };
    let isDrawing = false,
        mouseEnabled = true,
        gestureEnabled = true;
    let undoStack = [],
        redoStack = [];
    let lastX = 0,
        lastY = 0;

    function resizeDrawingCanvas() {
        const rect = drawCanvas.parentElement.getBoundingClientRect();
        drawCanvas.width = rect.width;
        drawCanvas.height = rect.height;
        const hc = document.getElementById('hand-canvas');
        hc.width = rect.width;
        hc.height = rect.height;
        redrawFromStack();
    }
    window.addEventListener('resize', resizeDrawingCanvas);

    function saveState() { undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height)); if (undoStack.length > 50) undoStack.shift();
        redoStack = []; }
    window.undo = function() { if (!undoStack.length) return;
        redoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
        drawCtx.putImageData(undoStack.pop(), 0, 0); };
    window.redo = function() { if (!redoStack.length) return;
        undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
        drawCtx.putImageData(redoStack.pop(), 0, 0); };
    window.clearCanvas = function() { saveState();
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); };

    function redrawFromStack() { if (undoStack.length) drawCtx.putImageData(undoStack[undoStack.length - 1], 0, 0); }

    function drawLine(x1, y1, x2, y2) {
        drawCtx.beginPath();
        drawCtx.moveTo(x1, y1);
        drawCtx.lineTo(x2, y2);
        drawCtx.strokeStyle = brush.type === 'eraser' ? 'rgba(0,0,0,1)' : brush.color;
        drawCtx.lineWidth = brush.size;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        if (brush.type === 'eraser') { drawCtx.globalCompositeOperation = 'destination-out'; } else { drawCtx.globalCompositeOperation = 'source-over';
            drawCtx.shadowColor = brush.color;
            drawCtx.shadowBlur = brush.glow; }
        drawCtx.stroke();
        drawCtx.shadowBlur = 0;
    }

    drawCanvas.addEventListener('mousedown', e => { if (!mouseEnabled) return;
        saveState();
        isDrawing = true;
        [lastX, lastY] = [e.offsetX, e.offsetY]; });
    drawCanvas.addEventListener('mousemove', e => { if (!isDrawing || !mouseEnabled) return;
        drawLine(lastX, lastY, e.offsetX, e.offsetY);
        [lastX, lastY] = [e.offsetX, e.offsetY]; });
    drawCanvas.addEventListener('mouseup', () => isDrawing = false);
    drawCanvas.addEventListener('mouseleave', () => isDrawing = false);

    window.updateBrush = function() {
        brush.size = +document.getElementById('brush-size').value;
        brush.color = document.getElementById('brush-color').value;
        brush.glow = +document.getElementById('brush-glow').value;
        brush.type = document.getElementById('brush-type').value;
    };
    window.saveCanvas = function() { const a = document.createElement('a');
        a.href = drawCanvas.toDataURL('image/png');
        a.download = 'digi-slate.png';
        a.click(); };
    window.exportCanvas = function() { saveCanvas(); };

    // ----------------------------------------------
    // 5. CAMERA & MEDIAPIPE
    // ----------------------------------------------
    let cameraStream = null,
        handsModel = null;
    let prevFingerTip = null,
        gestureDrawing = false;
    let fpsFrames = 0,
        fpsTime = performance.now();

    async function initCamera() {
        const video = document.getElementById('camera-video');
        const camDot = document.getElementById('cam-dot');
        const camStatus = document.getElementById('cam-status');
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
            video.srcObject = cameraStream;
            await video.play();
            camDot.className = 'status-dot green';
            camStatus.textContent = 'Connected';
            initMediaPipe(video);
        } catch (e) {
            camDot.className = 'status-dot red';
            camStatus.textContent = 'No Camera';
            setTimeout(initCamera, 3000);
        }
    }

    function initMediaPipe(video) {
        handsModel = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
        handsModel.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        handsModel.onResults(onHandResults);

        async function processVideoFrame() {
            if (video.readyState >= 2) { await handsModel.send({ image: video }); }
            requestAnimationFrame(processVideoFrame);
        }
        processVideoFrame();
    }

    function onHandResults(results) {
        fpsFrames++;
        const now = performance.now();
        if (now - fpsTime >= 1000) { document.getElementById('fps-display').textContent = fpsFrames;
            fpsFrames = 0;
            fpsTime = now; }

        const hc = document.getElementById('hand-canvas');
        const hctx = hc.getContext('2d');
        hctx.clearRect(0, 0, hc.width, hc.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            document.getElementById('hand-dot').className = 'status-dot green';
            document.getElementById('hand-status').textContent = 'Hand Detected';
            const landmarks = results.multiHandLandmarks[0];
            drawHandLandmarks(hctx, landmarks, hc.width, hc.height);
            if (gestureEnabled) processGestures(landmarks);
        } else {
            document.getElementById('hand-dot').className = 'status-dot red';
            document.getElementById('hand-status').textContent = 'No Hand';
            document.getElementById('gesture-display').textContent = 'None';
            prevFingerTip = null;
            gestureDrawing = false;
        }
    }

    function drawHandLandmarks(ctx, landmarks, w, h) {
        ctx.fillStyle = '#00f5ff';
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 8;
        const connections = [
            [0, 1],
            [1, 2],
            [2, 3],
            [3, 4],
            [0, 5],
            [5, 6],
            [6, 7],
            [7, 8],
            [5, 9],
            [9, 10],
            [10, 11],
            [11, 12],
            [9, 13],
            [13, 14],
            [14, 15],
            [15, 16],
            [13, 17],
            [17, 18],
            [18, 19],
            [19, 20],
            [0, 17]
        ];
        ctx.strokeStyle = 'rgba(168,85,247,0.6)';
        ctx.lineWidth = 2;
        connections.forEach(([a, b]) => { ctx.beginPath();
            ctx.moveTo((1 - landmarks[a].x) * w, landmarks[a].y * h);
            ctx.lineTo((1 - landmarks[b].x) * w, landmarks[b].y * h);
            ctx.stroke(); });
        landmarks.forEach((lm, i) => { ctx.beginPath();
            ctx.arc((1 - lm.x) * w, lm.y * h, [4, 8, 12, 16, 20].includes(i) ? 6 : 3, 0, Math.PI * 2);
            ctx.fill(); });
        ctx.shadowBlur = 0;
    }

    function countFingers(landmarks) {
        const thumbUp = Math.abs(landmarks[4].x - landmarks[2].x) > 0.05;
        const indexUp = landmarks[8].y < landmarks[6].y;
        const middleUp = landmarks[12].y < landmarks[10].y;
        const ringUp = landmarks[16].y < landmarks[14].y;
        const pinkyUp = landmarks[20].y < landmarks[18].y;
        return { thumb: thumbUp, index: indexUp, middle: middleUp, ring: ringUp, pinky: pinkyUp, count: [thumbUp, indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length };
    }

    function processGestures(landmarks) {
        const fingers = countFingers(landmarks);
        const canvasW = drawCanvas.width,
            canvasH = drawCanvas.height;
        const cx = (1 - landmarks[8].x) * canvasW;
        const cy = landmarks[8].y * canvasH;
        let gestureName = 'None';

        if (fingers.count === 1 && fingers.index) {
            gestureName = 'Draw';
            if (prevFingerTip) {
                if (!gestureDrawing) { saveState();
                    gestureDrawing = true; }
                drawLine(prevFingerTip.x, prevFingerTip.y, cx, cy);
            }
            prevFingerTip = { x: cx, y: cy };
            document.getElementById('draw-status').textContent = 'Drawing';
            document.getElementById('draw-dot').className = 'status-dot green';
        } else if (fingers.count === 2 && fingers.index && fingers.middle) {
            gestureName = 'Pointer';
            prevFingerTip = null;
            gestureDrawing = false;
        } else if (fingers.count >= 3 && fingers.index && fingers.middle && fingers.ring) {
            gestureName = 'Erase';
            if (prevFingerTip) {
                const savedComp = drawCtx.globalCompositeOperation;
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.beginPath();
                drawCtx.arc(cx, cy, 25, 0, Math.PI * 2);
                drawCtx.fill();
                drawCtx.globalCompositeOperation = savedComp;
            }
            prevFingerTip = { x: cx, y: cy };
        } else {
            prevFingerTip = null;
            gestureDrawing = false;
        }
        if (fingers.count !== 1) { gestureDrawing = false;
            prevFingerTip = null;
            document.getElementById('draw-status').textContent = 'Ready'; }
        document.getElementById('gesture-display').textContent = gestureName;
    }

    // ----------------------------------------------
    // 6. TOGGLES
    // ----------------------------------------------
    window.toggleGesture = function() { gestureEnabled = !gestureEnabled;
        document.getElementById('btn-gesture').classList.toggle('active'); };
    window.toggleMouse = function() { mouseEnabled = !mouseEnabled;
        document.getElementById('btn-mouse').classList.toggle('active'); };

    // ----------------------------------------------
    // 7. VOICE + MATH SOLVER using Math.js
    // ----------------------------------------------
    let voiceEnabled = false,
        recognition = null;
    const mathResultDiv = document.getElementById('math-result');

    // Use math.js for safe evaluation
    function evaluateMath(expr) {
        try {
            // Compile and evaluate with math.js – handles fractions, powers, etc.
            const node = math.parse(expr);
            const result = node.evaluate();
            if (typeof result === 'number' && isFinite(result)) {
                return Number.isInteger(result) ? result : result.toFixed(6);
            }
            return result.toString();
        } catch (e) {
            return 'Error: ' + e.message;
        }
    }

    window.toggleVoice = function() {
        voiceEnabled = !voiceEnabled;
        document.getElementById('btn-voice').classList.toggle('active');
        if (voiceEnabled) {
            startVoice();
        } else {
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            mathResultDiv.classList.add('hidden');
        }
    };

    function startVoice() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            alert('Voice recognition not supported. Please use Chrome/Edge.');
            voiceEnabled = false;
            document.getElementById('btn-voice').classList.remove('active');
            return;
        }

        try {
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (e) => {
                const last = e.results.length - 1;
                const transcript = e.results[last][0].transcript.trim().toLowerCase();
                console.log('🎤 Voice:', transcript);

                // --- MATH DETECTION ---
                const mathTriggers = ['plus', 'minus', 'times', 'divided by', 'over', 'calculate', 'solve', 'what is', 'evaluate', '='];
                if (mathTriggers.some(k => transcript.includes(k))) {
                    // Convert words to symbols
                    let expr = transcript
                        .replace(/what is/gi, '').replace(/calculate/gi, '').replace(/solve/gi, '').replace(/evaluate/gi, '')
                        .replace(/plus/gi, '+').replace(/minus/gi, '-').replace(/times/gi, '*').replace(/divided by/gi, '/').replace(/over/gi, '/')
                        .replace(/x/gi, '*') // handle 'x' as multiplication
                        .replace(/[^0-9+\-*/().%^ ]/g, '') // allow ^ for power
                        .trim();

                    if (expr) {
                        const result = evaluateMath(expr);
                        mathResultDiv.classList.remove('hidden');
                        mathResultDiv.textContent = `🧮 ${expr} = ${result}`;
                        // Draw on canvas
                        saveState();
                        drawCtx.font = 'bold 28px "Orbitron", monospace';
                        drawCtx.fillStyle = '#00f5ff';
                        drawCtx.shadowColor = '#00f5ff';
                        drawCtx.shadowBlur = 18;
                        drawCtx.fillText(`= ${result}`, 40, 100);
                        drawCtx.shadowBlur = 0;
                    }
                }

                // --- OTHER VOICE COMMANDS ---
                if (transcript.includes('undo')) undo();
                else if (transcript.includes('redo')) redo();
                else if (transcript.includes('clear')) clearCanvas();
                else if (transcript.includes('save')) saveCanvas();
            };

            recognition.onerror = (event) => {
                console.warn('Voice error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow microphone in browser settings.');
                    voiceEnabled = false;
                    document.getElementById('btn-voice').classList.remove('active');
                }
            };

            recognition.onend = () => {
                if (voiceEnabled) {
                    try { recognition.start(); } catch (e) { console.warn('Restart failed'); }
                }
            };

            recognition.start();
        } catch (err) {
            alert('Error starting voice recognition: ' + err.message);
            voiceEnabled = false;
            document.getElementById('btn-voice').classList.remove('active');
        }
    }

    // Math button toggle (UI)
    let mathMode = false,
        shapeMode = false;
    window.toggleMath = function() {
        mathMode = !mathMode;
        document.getElementById('btn-math').classList.toggle('active');
        if (!mathMode) mathResultDiv.classList.add('hidden');
    };
    window.toggleShape = function() {
        shapeMode = !shapeMode;
        document.getElementById('btn-shape').classList.toggle('active');
    };

    // Init icons after DOM ready
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    // also call after login
  </script>
 </body>
